name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Emscripten toolchain (emcc). Installs the latest SDK and puts emcc on PATH.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build the browser bundle
        run: make web

      # Gate: run the engine self test on the wasm build (22 checks) before
      # anything reaches Pages.
      - name: Verify the wasm build
        run: make webtest

      - uses: actions/configure-pages@v5

      # web/ holds exactly the deployable site: index.html + raycaster.js
      # (single file with the wasm inlined).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
